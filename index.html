<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <h1>PORTFOLIO</h1>
    <p>ยินดีต้อนรับสู่พื้นที่รวบรวมผลงานและโปรเจกต์ของฉัน</p>
    <a href="portfolio.html" class="btn">เข้าดูผลงาน</a>

</body>
</html>
