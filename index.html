<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj4MwTyyzkU8y02b0DCnzJ2rWMIXVqA0pb8i8eMjtpHToLP9izbYlhCQDsm294qpnuGjtb8YVRGbSftnzJEXxjPDFOBJ6ywdnPHLisq1laO1GEsPttCgh2ZrToXpPNMbAwpLQgQlSilE44/s1600/skyboarding-HD.jpg');
            background-size: cover;       
            background-position: center;  
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .profile-frame {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(56, 189, 248, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(5px);
            background-color: rgba(15, 23, 42, 0.6);
            margin-bottom: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-frame:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(56, 189, 248, 0.5);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #38bdf8;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.85); 
        }

        p {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.85);
            line-height: 1.8;
        }

        /* ส่วนกลุ่มปุ่มกดสำหรับเปิดหน้าต่างๆ */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 700px;
            width: 100%;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background-color: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            color: #38bdf8;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        /* ปุ่มหลักไฮไลท์สำหรับเริ่มอ่านตามลำดับ */
        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
            border: 1px solid #38bdf8;
        }

        .btn-primary:hover {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <div class="profile-frame">
        <img src="my-photo.jpg" alt="Profile Image" class="profile-img">
    </div>

    <h1>PORTFOLIO</h1>
    <p>ยินดีต้อนรับสู่แฟ้มสะสมผลงานของผม<br>นาย ธนาพิพัฒน์ เกียรติ์มีชัย<br>มัธยมศึกษาปีที่ 6 โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>

    <!-- กลุ่มปุ่มเปิดไปยังหน้าต่างๆ -->
    <div class="btn-group">
        <a href="intro.html" class="btn btn-primary">เริ่มต้นอ่านคำนำ →</a>
        <a href="about.html" class="btn">ประวัติส่วนตัว</a>
        <a href="portfolio.html" class="btn">ผลงาน</a>
        <a href="thankyou.html" class="btn">หน้าปิดท้าย</a>
    </div>

</body>
</html>
