<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-image: url('https://png.pngtree.com/thumb_back/fh260/back_our/20190617/ourmid/pngtree-blue-technology-background-banner-image_125518.jpg');
            background-size: cover;       
            background-position: center;  
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .profile-frame {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(56, 189, 248, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(5px);
            background-color: rgba(15, 23, 42, 0.6);
            margin-bottom: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-frame:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(56, 189, 248, 0.5);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #38bdf8;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.85); 
        }

        p {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.85);
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <div class="profile-frame">
        <!-- แก้ไข path รูปภาพให้เรียกใช้ไฟล์โปรไฟล์โดยตรง -->
        <img src="profile.jpg" alt="Profile Image" class="profile-img">
    </div>

    <h1>PORTFOLIO</h1>
    <p>ยินดีต้อนรับสู่แฟ้มสะสมผลงานของผม<br>นาย ธนาพิพัฒน์ เกียรติ์มีชัย<br>มัธยมศึกษาปีที่ 6 โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>
    <a href="about.html" class="btn">เริ่มต้นรู้จักกัน →</a>

</body>
</html>
