<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* 1. ใส่รูปพื้นหลังเพียวๆ ไม่เอาสีดำมาบัง */
            background-image: url('https://giffiles.alphacoders.com/224/224437.gif'); /* <-- เปลี่ยนชื่อไฟล์รูปภาพพื้นหลังตรงนี้ */
            
            background-size: cover;       
            background-position: center;  
            background-repeat: no-repeat; 
            background-attachment: fixed; 

            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        /* --- กรอบรูปภาพสัดส่วน 16:9 ดีไซน์สวยงาม --- */
        .profile-frame {
            width: 100%;
            max-width: 560px; /* ขนาดความกว้างของกรอบรูป */
            aspect-ratio: 16 / 9; /* บังคับสัดส่วน 16:9 อัตโนมัติ */
            border-radius: 16px;
            overflow: hidden;
            
            /* แต่งขอบเรืองแสงและเงาให้ดูมีมิติ */
            border: 2px solid rgba(56, 189, 248, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(5px);
            background-color: rgba(15, 23, 42, 0.6);
            
            margin-bottom: 25px; /* เว้นระยะห่างจากตัวหนังสือด้านล่าง */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-frame:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(56, 189, 248, 0.5);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ครอปรูปให้เต็มสัดส่วน 16:9 โดยภาพไม่เบี้ยว */
            display: block;
        }

        /* --- ส่วนข้อความและปุ่มกด (ขยับลงมาด้านล่าง) --- */
        h1 {
            font-size: 3.5rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #38bdf8;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.85); 
        }

        p {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.85);
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <!-- กรอบรูปภาพ 16:9 -->
    <div class="profile-frame">
        <!-- เปลี่ยนชื่อไฟล์รูปของคุณตรง src="..." ได้เลย -->
        <img src="https://simulationdaily.com/wp-content/uploads/fecb417e-changli-wuthering-waves-art.jpg" alt="Profile Image" class="profile-img">
    </div>

    <!-- ส่วนข้อความและปุ่มกดด้านล่าง -->
    <h1>PORTFOLIO</h1>
    <p>ยินดีค้อนรับเจ้าสู่แฟ้มสะสมผลงานของผม นาย ธนาพิพัฒน์ เกียรติ์มีชัย</p>
    <a href="portfolio.html" class="btn">เข้าดูผลงาน</a>

</body>
</html>
