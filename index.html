<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* ลบภาพพื้นหลังออก เปลี่ยนเป็นสีเรียบโทนเข้มเพื่อขับให้กระดาษ A4 เด่นขึ้น */
            background-color: #0f172a;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* กรอบทรงกระดาษ A4 */
        .a4-page {
            background-color: #ffffff;
            width: 100%;
            max-width: 794px; /* ความกว้างมาตรฐาน A4 บนหน้าจอ */
            aspect-ratio: 1 / 1.414; /* อัตราส่วนสัดส่วนกระดาษ A4 แนวตั้ง */
            border-radius: 8px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 10px rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .profile-frame {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #0284c7;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background-color: #f1f5f9;
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-frame:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(2, 132, 199, 0.25);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 15px;
            color: #0284c7;
        }

        p {
            font-size: 1.15rem;
            color: #334155;
            font-weight: 600;
            margin-bottom: 35px;
            line-height: 1.8;
        }

        /* ส่วนกลุ่มปุ่มกดสำหรับเปิดหน้าต่างๆ */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 600px;
            width: 100%;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #0284c7;
            background-color: #f0f9ff;
            border: 1.5px solid #0284c7;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .btn:hover {
            background-color: #e0f2fe;
            color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        /* ปุ่มหลักไฮไลท์สำหรับเริ่มอ่านตามลำดับ */
        .btn-primary {
            background-color: #0284c7;
            color: #ffffff;
            border: 1.5px solid #0284c7;
        }

        .btn-primary:hover {
            background-color: #0369a1;
            color: #ffffff;
            border-color: #0369a1;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }
    </style>
</head>
<body>

    <!-- โครงสร้างกระดาษ A4 -->
    <div class="a4-page">
        <div class="profile-frame">
            <img src="my-photo.jpg" alt="Profile Image" class="profile-img">
        </div>

        <h1>PORTFOLIO</h1>
        <p>ยินดีต้อนรับสู่แฟ้มสะสมผลงานของผม<br>นาย ธนาพิพัฒน์ เกียรติ์มีชัย<br>มัธยมศึกษาปีที่ 6 โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>

        <!-- กลุ่มปุ่มเปิดไปยังหน้าต่างๆ -->
        <div class="btn-group">
            <a href="intro.html" class="btn btn-primary">เริ่มต้นอ่านคำนำ →</a>
            <a href="about.html" class="btn">ประวัติส่วนตัว</a>
            <a href="portfolio.html" class="btn">ผลงาน</a>
            <a href="thankyou.html" class="btn">หน้าปิดท้าย</a>
        </div>
    </div>

</body>
</html>
