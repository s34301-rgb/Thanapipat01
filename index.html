<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* 1. ใส่รูปพื้นหลัง + สีมืดทับแบบโปร่งแสง (Overlay) เพื่อให้ข้อความอ่านง่ายขึ้น */
            background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                              url('https://gachago.com/wp-content/uploads/2024/09/wuthering-1.3.jpg'); /* <-- เปลี่ยนชื่อไฟล์รูปภาพพื้นหลังตรงนี้ */
            
            /* 2. การตั้งค่าให้ภาพพื้นหลังปรับขนาด Auto และเต็มหน้าจอ */
            background-size: cover;       /* ปรับขนาดรูปให้คลุมเต็มพื้นที่หน้าจออัตโนมัติ */
            background-position: center;  /* จัดรูปภาพให้อยู่ตรงกลางเสมอ */
            background-repeat: no-repeat; /* ไม่ให้รูปแสดงซ้ำ */
            background-attachment: fixed; /* ล็อคพื้นหลังให้อยู่กับที่เวลาสโครล */

            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #38bdf8;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); /* เพิ่มเงาให้ข้อความเด่นขึ้น */
        }

        p {
            font-size: 1.2rem;
            color: #e2e8f0;
            margin-bottom: 35px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <h1>PORTFOLIO</h1>
    <p>ยินดีต้อนรับสู่พื้นที่รวบรวมผลงานและโปรเจกต์ของฉัน</p>
    <a href="portfolio.html" class="btn">เข้าดูผลงาน</a>

</body>
</html>
