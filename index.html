<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* 1. ใส่รูปพื้นหลังเพียวๆ ไม่เอาสีดำมาบัง */
            background-image: url('https://giffiles.alphacoders.com/224/224437.gif'); /* <-- เปลี่ยนชื่อไฟล์รูปภาพพื้นหลังตรงนี้ */
            
            /* 2. การตั้งค่าให้ภาพพื้นหลังปรับขนาด Auto และเต็มหน้าจอ */
            background-size: cover;       /* ปรับขนาดรูปให้คลุมเต็มพื้นที่หน้าจออัตโนมัติ */
            background-position: center;  /* จัดรูปภาพให้อยู่ตรงกลางเสมอ */
            background-repeat: no-repeat; /* ไม่ให้รูปแสดงซ้ำ */
            background-attachment: fixed; /* ล็อคพื้นหลังให้อยู่กับที่เวลาสโครล */

            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #38bdf8;
            /* เพิ่มเงาเข้มหลังตัวอักษรเพื่อให้ยังคงอ่านง่ายแม้ภาพพื้นหลังจะสว่าง */
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.85); 
        }

        p {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 500;
            margin-bottom: 35px;
            /* เพิ่มเงาเข้มหลังตัวอักษร */
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.85);
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            background-color: #38bdf8;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body>

    <h1>PORTFOLIO</h1>
    <p>ยินดีต้อนรับสู่พื้นที่รวบรวมผลงานและโปรเจกต์ของฉัน</p>
    <a href="portfolio.html" class="btn">เข้าดูผลงาน</a>

</body>
</html>
